
name: PureView Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pureview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PureView debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Locate Android source project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            PROJECT_DIR="."
          elif [[ -f "PureView-Android/settings.gradle.kts" && -f "PureView-Android/app/build.gradle.kts" ]]; then
            PROJECT_DIR="PureView-Android"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './_pureview_source/*' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: Android source project not found."
              exit 1
            fi

            echo "Found source archive: $ZIP_FILE"
            mkdir -p _pureview_source
            unzip -q "$ZIP_FILE" -d _pureview_source

            SETTINGS_FILE="$(find _pureview_source -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: settings.gradle.kts was not found inside the ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          for REQUIRED_FILE in settings.gradle.kts app/build.gradle.kts gradlew gradle/wrapper/gradle-wrapper.properties; do
            if [[ ! -f "$PROJECT_DIR/$REQUIRED_FILE" ]]; then
              echo "ERROR: Missing required file: $PROJECT_DIR/$REQUIRED_FILE"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: bash ./gradlew --no-daemon --stacktrace --build-cache :app:assembleDebug

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK generated successfully: $APK"
          echo "### PureView APK build succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "The debug APK is attached below as the **PureView-Android-APK** artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PureView-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
